[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-research"
version = "0.0.0"
description = "Research framework for resource-efficient AI on embedded hardware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/jaworekk85/EdgeAI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "jetson: requires supported Jetson hardware and software; skip on other hosts",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
