experiment: reference
seed: 7
architectures: [mobilenet_v3_small, mobilenet_v3_large]
runtimes: [pytorch, onnxruntime]
per_class: 2
archive_url: https://s3.amazonaws.com/fast-ai-imageclas/imagenette2-160.tgz
archive_md5: e793b78cc4c9e9a4ccc0c1155377a412
preprocessing:
  resize_short_edge: 256
  crop: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  interpolation: bilinear
  layout: NCHW
  color: RGB
protocol:
  warmup_iterations: 5
  iterations: 20
  repetitions: 1
execution:
  intra_op_threads: 1
  inter_op_threads: 1
  provider: CPUExecutionProvider
  ort_execution: sequential
  memory_interval_s: 0.01
power:
  source: constant_mock
  assumed_watts: 5.0
  assumed_idle_watts: 1.0
  sampling_hz: 100.0
  idle_duration_s: 0.02
device:
  adapter: cpu
  requested_power_mode: null
